# This workflow will test the golang project
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: tools/opdb-importer/go.mod
        cache-dependency-path: tools/opdb-importer/go.sum

    - name: Format
      run: make fmt

    - name: Vet
      if: ${{ !cancelled() }}
      run: make vet

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: tools/opdb-importer/go.mod
        cache-dependency-path: tools/opdb-importer/go.sum

    - name: Test
      run: make test
